name: Deploy DEV API

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - kirita-dev

    steps:
      - name: Verify DEV fetch access
        shell: powershell
        run: |
  $git = "C:\Program Files\Git\cmd\git.exe"
  $php = "C:\xampp\php\php.exe"
  $composer = "C:\ProgramData\ComposerSetup\bin\composer.bat"
  $repo = "C:\Kirita\dev\api"

  & $git -C $repo fetch origin develop
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  & $git -C $repo reset --hard origin/develop
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  Push-Location $repo

  & $composer install --no-interaction --prefer-dist --optimize-autoloader
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  & $php artisan migrate --force
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  & $php artisan optimize:clear
  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  Pop-Location
name: Deploy DEV API

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - kirita-dev

    steps:
      - name: Verify DEV deployment access
        shell: powershell
        run: |
          & "C:\Program Files\Git\cmd\git.exe" -C "C:\Kirita\dev\api" status
          & "C:\xampp\php\php.exe" --version
          & "C:\ProgramData\ComposerSetup\bin\composer.bat" --version